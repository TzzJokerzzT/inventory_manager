    post:
      tags: [suppliers]
      summary: Create a supplier
      description: |
        Writing the supplier roster is `manage_products`: an OWNER or an ADMIN
        may create, edit and delete suppliers; a MEMBER reads them.

        The name is unique inside the company, case-sensitively, and the
