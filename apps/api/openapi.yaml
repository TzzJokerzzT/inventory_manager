    patch:
      tags: [products]
      summary: Update a product
      description: |
        Requires `manage_products` (ADMIN or OWNER). The update is partial: an
        absent field keeps its value, while an explicit `null` clears
        `description` or `photoUrl`.

        Changing the SKU re-checks uniqueness against every row of the company,
        soft-deleted ones included; keeping the product's own SKU is not a
        conflict. `stockQuantity` is never settable here.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
