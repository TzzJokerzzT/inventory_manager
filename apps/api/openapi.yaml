            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/suppliers/{supplierId}:
    patch:
      tags: [suppliers]
      summary: Update a supplier
      description: |
        Partial update: an absent field is unchanged, and an explicit `null`
        clears `contact`. Sending no field is accepted and changes nothing.

        Same authorization as creating: OWNER or ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierRequest"
      responses:
        "200":
          description: The supplier after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: The supplier id is not a UUID, or a field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `user_not_provisioned`, `company_access_forbidden` or
            `insufficient_role`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The supplier does not exist in this company. The `code` is
            `supplier_not_found`; a supplier of another company answers the
            same, so the endpoint never reveals it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            Renaming onto a name the company already uses. The `code` is
            `supplier_name_already_exists`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [suppliers]
      summary: Soft-delete a supplier
      description: |
        Stamps `deletedAt`: the row survives because purchase lots reference it,
        and the roster stops returning it. The name stays reserved by the
        uniqueness index. Idempotent from the caller's point of view: a second
        delete of an already deleted supplier answers `404`, because it is no
        longer part of the roster.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supplier deleted; no body.
        "400":
          description: The supplier id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `user_not_provisioned`, `company_access_forbidden` or
            `insufficient_role`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The supplier does not exist in this company (`supplier_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/lots:
    post:
      tags: [lots]
      summary: Register a purchase lot
      description: |
        Records one purchase: the lot, its physical units, the `IN` movement
        that brings them in and the increment of the product's stock, all in one
        operation. Any of the four failing leaves nothing behind.

        The `measureTotal` is **derived** from the units' `measures` and is not
        part of the body; sending it answers `400 measure_total_derived`. Each
        unit's `cost` is its `measure` times `costPerMeasure` rounded to two
        decimals, and the last unit absorbs the rounding difference so the unit
        costs add up exactly to `measureTotal × costPerMeasure`.

        The stock still counts whole units: the movement's `quantity` is the
        number of units, never the weight.

        Registering a lot is `manage_products`: an OWNER or an ADMIN writes, a
        MEMBER reads. The product and the supplier must both be active in the
        company the caller has context for.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLotRequest"
      responses:
        "201":
          description: The lot, its derived total and its units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLot"
        "400":
          description: |
            A `measureTotal` was sent (`measure_total_derived`), or the body is
            invalid: no measures, a non-positive measure, a measure with more
            than three decimals, a `costPerMeasure` that is not a decimal
            string, or a malformed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user (`user_not_provisioned`), the caller
            has no ACTIVE membership (`company_access_forbidden`), or the role
            is a MEMBER (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The product (`product_not_found`) or the supplier
            (`supplier_not_found`) is not active in this company. Nothing was
            written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/reports/movements:
    get:
      tags: [reports]
      summary: Stock movement trend for the dashboard
      description: |
        Aggregates the company's stock movements by **UTC day** for the last
        `days` days, oldest first, with zero-filled days for the ones without
        movements. `entries` and `exits` are the sum of the quantities of the
        `IN` and `OUT` movements of that day.

        The range is computed server-side and the read filters by `companyId`
        and `createdAt >= since`, so a company never sees another company's
        movements. Any ACTIVE member may read it: the company context is the
        guard.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          required: false
          description: Number of UTC days in the series, ending today.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: The daily series, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementTrendResponse"
        "400":
          description: The company id is not a UUID, or `days` is out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/products/{productId}/restore:
    post:
      tags: [products]
      summary: Restore a soft-deleted product
      description: |
        Clears the product's `deletedAt` and returns it active again, with its
        SKU and its movement history untouched. It is the answer to "bring back
        the product I deleted": the SKU of a soft-deleted product stays reserved,
        so creating a new product with the same SKU is a 409, and restoring is
        the way to reuse the product itself.

        Requires `manage_products` (ADMIN or OWNER), the same permission as the
        soft delete. Restoring a product that is **not** deleted answers
        `409 product_not_deleted`: the trash is a state, not a flag. A product
        from another company answers the same 404 as a nonexistent one.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The restored product, active again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: The company id or the product id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`), the
            caller has no ACTIVE membership in the company
            (`company_access_forbidden`), or their role cannot write products
            (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The product does not exist or belongs to another company; the `code`
            is `product_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The product is not soft-deleted, so there is nothing to restore; the
            `code` is `product_not_deleted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/products/{productId}/permanent:
    delete:
      tags: [products]
      summary: Permanently delete a soft-deleted product
      description: |
        Removes the row from the database. It is the second half of the trash:
        a product can be **restored** or **purged**.

        Only the **OWNER** may purge (`purge_products`): it is irreversible. The
        product must already be soft-deleted (the trash is the only entry point)
        and must have **no stock movements**: the ledger is the audit trail
        (MOV-05) and is never deleted. A product with movements answers
        `409 product_has_movements`; the database's `ON DELETE RESTRICT` is the
        last guard, so a movement created between the count and the delete also
        answers that 409 instead of a 500.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product permanently deleted. No body.
        "400":
          description: The company id or the product id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`), the
            caller has no ACTIVE membership (`company_access_forbidden`), or
            their role is not OWNER (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The product does not exist or belongs to another company; the `code`
            is `product_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The product is not soft-deleted (`product_not_deleted`) or it has
            stock movements (`product_has_movements`); nothing is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me:
    get:
      tags: [me]
      summary: Resolve the authenticated user and their memberships
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's public identity and each membership with its company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [me]
      summary: Set or clear the authenticated user's display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: |
            The caller's public identity (with the new `fullName`) and each
            membership with its company. The representation is identical to
            `GET /me` so the client can replace its state from either route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me/invitations:
    get:
      tags: [me]
      summary: List the caller's pending company invitations
      description: |
        Returns every membership addressed to the caller's own email and still
        in the `INVITED` state, each with the company that invited them. It is
        the read the web client needs to show a pending invitation instead of
        calling the accept endpoint blindly.

        The subject is the resolved user, so the request names no email and can
        never read another account's invitations. The criterion is the same the
        accept endpoint applies, so there is only one definition of "pending
        invitation".

        Having nothing pending is the normal case: the answer is an empty array
        with a `200`, never a `404`. The `INVITED` status is pinned by the
        query, so it is not repeated in the payload.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            The caller's pending invitations. Empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me/invitations/accept:
    post:
      tags: [me]
      summary: Accept the caller's pending company invitations
      description: |
        Turns every membership addressed to the caller's own email and still in
        the `INVITED` state into an `ACTIVE` one. The subject is the resolved
        user, so the request carries no body and can never name another email.

        It is idempotent: calling it again after everything is accepted returns
        an empty array with the same `200`. Having nothing pending is the normal
        case, not an error, which is why there is no `404`.

        A membership that stopped being `INVITED` before the write (a
        revocation, or a concurrent acceptance) is skipped rather than revived.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            The memberships that became ACTIVE. Empty when nothing was pending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me/notifications:
    get:
      tags: [me]
      summary: List the caller's notifications
      description: |
        Returns the caller's notification events, newest first, each with the
        company the event happened in (or `null` when it could not be
        resolved). A notification is an event ("X accepted your invitation"),
        not a pending invitation: the latter is state and is read from
        `GET /me/invitations`.

        The subject is the resolved user, so the request names no id and can
        never read another account's notifications. No news is the normal
        case: the answer is an empty array with a `200`, never a `404`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            The caller's notifications, newest first. Empty when there are
            none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me/notifications/read:
    post:
      tags: [me]
      summary: Mark all the caller's notifications as read
      description: |
        Marks every unread notification of the caller as read. It is one
        action for the whole list, so the UI needs a single button, and it is
        idempotent: marking again changes nothing. The subject is the resolved
        user, so a request can never mark another account's notifications.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller's unread notifications were marked read.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [status, uptime]
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 256

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: number
          description: Access-token lifetime in seconds.

    RegisterResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Company:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    CompanyContextResponse:
      type: object
      required: [company, role]
      properties:
        company:
          $ref: "#/components/schemas/Company"
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]

    MeMembership:
      type: object
      required: [companyId, role, company]
      properties:
        companyId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        company:
          $ref: "#/components/schemas/Company"

    UserSummary:
      type: object
      required: [id, fullName, email]
      description: |
        A user as another member sees them: the inviter of a pending invitation
        or the actor of a notification event. One shape for both, so they
        cannot drift apart. `fullName` is nullable because a user created by
        Auth0 starts without a display name; the email is then the identifier
        the UI falls back to. It is deliberately minimal -- no roles, no
        memberships -- so it stays context, not a second profile.
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
        email:
          type: string
          format: email

    PendingInvitation:
      type: object
      required: [membershipId, companyId, role, invitedAt, company, inviter]
      description: |
        A still-pending invitation. It carries no `status` because the read
        pins the membership to `INVITED`; the field would repeat the query.
      properties:
        membershipId:
          type: string
          format: uuid
          description: The membership id, useful as a stable key in the UI.
        companyId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        invitedAt:
          type: string
          format: date-time
          description: |
            When the invitation was created, i.e. the membership's
            `createdAt`.
        company:
          $ref: "#/components/schemas/Company"
        inviter:
          description: |
            Who sent the invitation, or `null` when their user row could not
            be resolved. A missing inviter never hides the invitation: the
            invitation is the fact, the inviter is context, and the UI falls
            back to a neutral label.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"

    MeNotification:
      type: object
      required: [id, type, createdAt, readAt, company, actor]
      description: |
        A notification event (e.g. an invitation was accepted). It is not a
        pending invitation: that is state, read from `GET /me/invitations`.
        `readAt` is null while unread. `company` is null when the event's
        company could not be resolved and `actor` is null when the person who
        triggered it could not be resolved (including rows written before the
        actor was recorded); the event is the fact, the rest is context.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: The event kind, e.g. `membership.accepted`.
          example: membership.accepted
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        company:
          description: |
            The company the event happened in, or `null` when it could not be
            resolved. A missing company never hides the notification.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Company"
        actor:
          description: |
            Who triggered the event, or `null` when it could not be resolved.
            A missing actor never hides the notification: the UI falls back to
            a neutral label.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"

    MeasureUnit:
      type: string
      enum: [KILOGRAM, LITRE, METRE]
      description: |
        The unit a purchase lot of a product is measured in (L19): kilograms,
        litres or metres. It describes the **measure of a lot**, never the
        stock, which keeps counting whole units (S7). A closed list on purpose:
        an unknown value is a client mistake and answers 400, not a stored
        string no view can name.

        On a product write it is optional: absent on create means `KILOGRAM`
        (the column's default, which is what a product created before the
        purchase lots carries) and absent on update means "unchanged".

    Product:
      type: object
      required:
        [id, companyId, name, description, sku, price, photoUrl, stockQuantity, lowStockThreshold, measureUnit, categoryId, createdAt, updatedAt]
      description: |
        A product as the API exposes it. `price` is a decimal string with two
        decimals, not a JSON number: the column is `Decimal(12,2)` and a float
        would lose precision at the first rounding.

        `stockQuantity` is server-owned: only stock movements change it, never
        a product write. `lowStockThreshold` keeps the database default until
        the low-stock feature exposes it. `categoryId` is currently always
        `null`: categories have no feature of their own yet.

        `measureUnit` is how the lots of this product are measured; it is what
        gives `costPerMeasure` its unit, so a client can render `$ per kg`
        without a second read (L19).

        A soft-deleted product is never returned by any operation, so it has no
        `deletedAt` field in the contract.
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
        sku:
          type: string
          maxLength: 64
          description: Stored and returned in uppercase, so uniqueness ignores case.
        price:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
          example: "1500.00"
          description: Decimal string with exactly two decimals, e.g. `1500.00`.
        photoUrl:
          type: string
          maxLength: 2048
          nullable: true
        stockQuantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        measureUnit:
          $ref: "#/components/schemas/MeasureUnit"
        categoryId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductCosts:
      type: object
      required:
        [availableUnits, availableMeasure, costPerMeasure, unitCost, marginPerUnit]
      description: |
        The cost figures of a product, **derived** from its `AVAILABLE` units
        (L12), never stored: `costPerMeasure` is `Σ cost / Σ measure`,
        `unitCost` is `Σ cost / count` and `marginPerUnit` is the product's
        listed `price` minus `unitCost`. A sold unit contributes neither cost
        nor measure, so the numbers always describe what is still in stock.

        Money is a decimal string with two decimals and the measure has three;
        both are computed with exact arithmetic on the server and rounded half
        up. `costPerMeasure`, `unitCost` and `marginPerUnit` are `null` -- never
        `0` -- while the product has no available unit: no cost is not a zero
        cost. `availableUnits` and `availableMeasure` are real zeros then,
        because they count units and sum a measure, not money.
      properties:
        availableUnits:
          type: integer
          minimum: 0
          description: How many units of the product are still `AVAILABLE`.
        availableMeasure:
          type: string
          pattern: "^\\d+\\.\\d{3}$"
          example: "10.000"
          description: |
            Σ `measure` of those units, in the product's measure unit, with
            three decimals.
        costPerMeasure:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          nullable: true
          example: "5900.00"
          description: |
            Σ cost / Σ measure: what one measure of the remaining stock cost.
            `null` with no available units.
        unitCost:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          nullable: true
          example: "29500.00"
          description: |
            Σ cost / number of available units: the average cost of one unit.
            `null` with no available units.
        marginPerUnit:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          nullable: true
          example: "-20500.00"
          description: |
            The product's listed `price` minus `unitCost`; negative when the
            list price is below the cost. `null` with no `unitCost`.

    ProductListItem:
      allOf:
        - $ref: "#/components/schemas/Product"
        - $ref: "#/components/schemas/ProductCosts"
      description: |
        A product as the catalogue list shows it: the stored fields plus the
        costs derived from its available units (L12). The list deliberately
        carries no lots; those are the detail's answer.

    ProductLotSummary:
      type: object
      required:
        [id, supplierId, supplierName, receivedAt, measureTotal, costPerMeasure, unitCount, availableUnits]
      description: |
        One purchase lot of a product, as the "which supplier should I buy
        from" view shows it (L12): what arrived, from whom, at what price per
        measure, and how much of it is still available.
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
          maxLength: 120
          description: |
            Resolved by the API, including a supplier that was soft-deleted
            afterwards: the lot keeps showing whose purchase it was.
        receivedAt:
          type: string
          format: date-time
        measureTotal:
          type: string
          pattern: "^\\d+\\.\\d{3}$"
          example: "10.000"
          description: Σ measure of the lot's units, with three decimals.
        costPerMeasure:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          example: "5900.00"
          description: The price of one measure of this lot, with two decimals.
        unitCount:
          type: integer
          minimum: 1
          maximum: 500
        availableUnits:
          type: integer
          minimum: 0
          description: How many units of this lot are still `AVAILABLE`.

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - $ref: "#/components/schemas/ProductCosts"
        - type: object
          required: [lots]
          properties:
            lots:
              type: array
              maxItems: 50
              description: |
                The latest 50 lots of the product, newest first (`receivedAt`,
                then `createdAt`, then id). Empty for a product that never came
                in a lot.
              items:
                $ref: "#/components/schemas/ProductLotSummary"
      description: |
        The detail of one product: the stored fields, the costs derived from its
        available units and its latest lots (L12).

    ProductUnit:
      type: object
      required: [id, code, measure, cost, status, lotId, receivedAt]
      description: |
        One physical unit of a product, as the sale screen lists it (L23): which
        unit it is, how much it measures, what it cost, and the lot it came in.
        The list is ordered by the lot's date and then by the code, so the first
        unit is the oldest stock.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 32
          example: R-01
          description: Generated from the unit's position inside its lot.
        measure:
          type: string
          pattern: "^\\d{1,9}\\.\\d{3}$"
          example: "12.500"
          description: |
            The unit's measure in the product's measure unit, with exactly three
            decimals.
        cost:
          type: string
          pattern: "^\\d{1,10}\\.\\d{2}$"
          example: "73750.00"
          description: |
            The unit's own share of the lot's cost, with exactly two decimals.
        status:
          type: string
          enum: [AVAILABLE, SOLD]
        lotId:
          type: string
          format: uuid
          description: The purchase lot the unit came in.
        receivedAt:
          type: string
          format: date-time
          description: |
            The lot's business date, which is what orders the list: oldest
            first.

    CreateProductRequest:
      type: object
      required: [name, sku, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sku:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed and stored in uppercase; unique within the company.
        price:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
          example: "1500.00"
        description:
          type: string
          maxLength: 1000
          nullable: true
        photoUrl:
          type: string
          maxLength: 2048
          nullable: true
        measureUnit:
          $ref: "#/components/schemas/MeasureUnit"

    UpdateProductRequest:
      type: object
      description: |
        Partial update. An absent field keeps its current value; an explicit
        `null` clears `description` or `photoUrl`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sku:
          type: string
          minLength: 1
          maxLength: 64
        price:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
        description:
          type: string
          maxLength: 1000
          nullable: true
        photoUrl:
          type: string
          maxLength: 2048
          nullable: true
        measureUnit:
          $ref: "#/components/schemas/MeasureUnit"

    StockMovement:
      type: object
      required:
        [id, companyId, productId, type, quantity, reason, createdAt, product, actor, customerId, customer, lotId, unitPrice, units, margin]
      description: |
        One immutable stock movement -- the audit trail of the inventory
        (MOV-05). `type` is `IN` for an entry and `OUT` for an exit, and
        `quantity` is always positive: the direction lives in `type`, never in
        the sign of the number. `product` and `actor` are resolved by the API;
        `actor` is null when the user row cannot be resolved.

        `unitPrice` is the price written on the sale (S1) and `units` are the
        whole rolls it took (S2), each with its own measure and cost (S3):
        together they are what the real margin is computed from. Both are empty
        for an entry and for any movement recorded before the field existed
        (S9), which is reported as "no cost" instead of assuming a value. An
        entry also carries the `lotId` it brought in, and never carries units.

        `margin` is computed by the server (L11) as `unitPrice × quantity` minus
        the sum of the units' costs, and it is `null` -- never `0` -- when the
        price was not written or the movement took no units, which is the "sin
        costo" the client shows.
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [IN, OUT]
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        reason:
          type: string
          maxLength: 300
          nullable: true
        createdAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
          nullable: true
          description: |
            The customer associated with the sale, or null for an anonymous
            exit (or any entry). Only `OUT` movements can carry one.
        customer:
          description: |
            The associated customer resolved by the API, or null when there is
            none. A customer that was soft-deleted after the sale is still
            resolved here: the movement is the audit trail.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MovementCustomer"
        product:
          $ref: "#/components/schemas/MovementProduct"
        actor:
          description: |
            Who registered the movement, or `null` when the user could not be
            resolved. A missing actor never hides the movement.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        lotId:
          type: string
          format: uuid
          nullable: true
          description: |
            The purchase lot this entry brought in (S6), or null. Only the lot
            registration sets it, so an exit never carries one.
        unitPrice:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
          nullable: true
          description: |
            The price actually charged in this sale (S1). It is the same for
            every roll of the sale and varies only by customer; the catalogue
            price is the list price, not this one. Null means the price was not
            written: an entry, or a movement recorded before the field existed
            (S9).
        units:
          type: array
          maxItems: 500
          description: |
            The physical units this sale took, in code order. Empty for an
            entry, and for a sale of a product that never came in a lot. The
            cost of each one is what the margin is computed from (S3).
          items:
            $ref: "#/components/schemas/MovementUnit"
        margin:
          type: string
          pattern: "^-?\\d+\\.\\d{2}$"
          nullable: true
          example: "4298.75"
          description: |
            `unitPrice × quantity` minus the sum of the units' costs, as money
            with two decimals (L11). A negative value is a sale below cost. It is
            `null` when there is no price (a movement recorded before the field
            existed, S9) or no units (an entry, or a sale of a product that never
            came in a lot) -- never `0`, which would mean "sold at cost".

    MovementUnit:
      type: object
      required: [id, code, measure, cost]
      description: |
        One physical unit a sale took out -- a roll, for example (S2, S3). The
        measure is a `Decimal(12,3)` string and the cost is this unit's own
        share of the lot's cost, a `Decimal(12,2)` string; the sale's margin is
        the written price minus the sum of these costs, never an average.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 32
          description: The code of the unit inside its lot (`R-01`, `R-02`...).
        measure:
          type: string
          pattern: "^\\d{1,9}(\\.\\d{1,3})?$"
        cost:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"

    MovementProduct:
      type: object
      required: [id, name, sku]
      description: The product a movement refers to, as the history shows it.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        sku:
          type: string
          maxLength: 64

    MovementCustomer:
      type: object
      required: [id, name]
      description: |
        The customer a sale is associated with, as the history shows it. It is
        resolved even when the customer was soft-deleted afterwards, because
        the movement must stay readable.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120

    RegisterMovementRequest:
      type: object
      required: [productId, type, quantity]
      properties:
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [IN, OUT]
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        reason:
          type: string
          maxLength: 300
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Associates the sale with a customer. Only valid when `type` is
            `OUT`; an entry with a customer answers 400 `customer_requires_exit`.
            The customer must be active and belong to the company.
        unitPrice:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
          nullable: true
          description: |
            The price actually charged for each unit of this sale (S1), with the
            same rule as the product price: a positive decimal string with up to
            ten integer digits and up to two decimals. Required when the product
            has units available, together with `unitIds`; an entry carrying it
            answers 400 `unit_price_requires_exit`.
        unitIds:
          type: array
          maxItems: 500
          uniqueItems: true
          nullable: true
          description: |
            The whole units this sale takes (S2), one id per unit of
            `quantity`. Required when the product has units available: a missing
            or mismatched list answers 400 `units_required`, and a unit that is
            sold or belongs to another product or company answers 409
            `unit_not_available`. An entry carrying a non-empty list answers 400
            `units_require_exit`.
          items:
            type: string
            format: uuid

    RegisterMovementResponse:
      allOf:
        - $ref: "#/components/schemas/StockMovement"
        - type: object
          required: [stockQuantity]
          description: |
            The movement, the units it took, and the product's stock **after**
            it. The stock is a consequence of the movement, never an input.
          properties:
            stockQuantity:
              type: integer
              minimum: 0

    Supplier:
      type: object
      required:
        [id, companyId, name, contact, createdAt, updatedAt]
      description: |
        A supplier of bulk goods. `contact` is free text (a person, a phone, an
        email or all three) and nullable: an empty value is stored as null. The
        name is unique inside the company, case-sensitively, and soft-deleted
        rows keep their name reserved. A deleted supplier is never returned and
        has no `deletedAt` field in the contract.
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        contact:
          type: string
          maxLength: 120
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SupplierLastLot:
      type: object
      required:
        [id, productId, productName, costPerMeasure, measureUnit, receivedAt]
      description: |
        The most recent purchase lot of a supplier, as the roster summarizes it
        (L12): which product it was, its price per measure, the unit that
        measure is expressed in, and when it arrived.
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
          maxLength: 120
          description: |
            Resolved by the API, including a product that was soft-deleted
            afterwards: the lot keeps answering what was bought.
        costPerMeasure:
          type: string
          pattern: "^\\d+\\.\\d{2}$"
          example: "5900.00"
          description: The price of one measure of that lot, with two decimals.
        measureUnit:
          $ref: "#/components/schemas/MeasureUnit"
        receivedAt:
          type: string
          format: date-time

    SupplierListItem:
      allOf:
        - $ref: "#/components/schemas/Supplier"
        - type: object
          required: [lastLot]
          properties:
            lastLot:
              description: |
                The supplier's most recent lot, or `null` when the company never
                bought from it -- never a fabricated row.
              nullable: true
              allOf:
                - $ref: "#/components/schemas/SupplierLastLot"
      description: |
        A supplier as the roster list shows it: the stored fields plus its latest
        lot (L12). The write endpoints keep answering the plain `Supplier`: a
        supplier that was just created has no lots yet.

    CreateSupplierRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          maxLength: 120
          nullable: true

    UpdateSupplierRequest:
      type: object
      description: |
        Every field is optional and its absence means "unchanged", while an
        explicit `null` clears `contact`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          maxLength: 120
          nullable: true

    StockLot:
      type: object
      required:
        [id, companyId, productId, supplierId, receivedAt, measureTotal, costPerMeasure, unitCount, note, createdAt, units]
      description: |
        A purchase lot: one delivery of a measured product from one supplier
        (S6). `measureTotal` is the sum of its units' `measure` and is never
        sent by the client; `costPerMeasure` is the price of one measure;
        `unitCount` is the number of physical units and is what the `IN`
        movement adds to the stock.

        Each unit's `cost` is its own `measure × costPerMeasure` rounded to two
        decimals, and the last unit absorbs the rounding difference, so the unit
        costs add up exactly to `measureTotal × costPerMeasure` (S3).
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        measureTotal:
          type: string
          pattern: "^\\d{1,9}\\.\\d{3}$"
          example: "84.500"
          description: Decimal string with exactly three decimals, derived from the units.
        costPerMeasure:
          type: string
          pattern: "^\\d{1,10}\\.\\d{2}$"
          example: "5900.00"
          description: Decimal string with exactly two decimals.
        unitCount:
          type: integer
          minimum: 1
          maximum: 500
          description: The number of physical units, i.e. what the stock counts.
        note:
          type: string
          maxLength: 300
          nullable: true
          description: |
            Free annotation of the purchase. It also travels to the ledger as
            the reason of the `IN` movement.
        createdAt:
          type: string
          format: date-time
        units:
          type: array
          items:
            $ref: "#/components/schemas/StockLotUnit"

    StockLotUnit:
      type: object
      required: [id, code, measure, cost, status]
      description: |
        One physical unit of a lot -- a roll, for example. It carries its own
        measure, so its cost is its own instead of an average of the lot. The
        code is generated from the position (`R-01`, `R-02`, ...), and `status`
        is `AVAILABLE` until a sale takes the unit (S2: whole units only).
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 32
          example: R-01
        measure:
          type: string
          pattern: "^\\d{1,9}\\.\\d{3}$"
          example: "12.500"
          description: Decimal string with exactly three decimals, always positive.
        cost:
          type: string
          pattern: "^\\d{1,10}\\.\\d{2}$"
          example: "73750.00"
          description: Decimal string with exactly two decimals.
        status:
          type: string
          enum: [AVAILABLE, SOLD]

    CreateLotRequest:
      type: object
      required: [productId, supplierId, costPerMeasure, measures]
      description: |
        `measureTotal` is **derived** from `measures` and is not part of the
        body: a typed total could disagree with the units it summarizes, so
        sending one answers `400 measure_total_derived` instead of being
        ignored.

        Unit codes are generated by the API from the position, so the client
        sends one measure per unit and nothing else.
      properties:
        productId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        costPerMeasure:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
          example: "5900.00"
          description: Price of one measure, greater than 0.
        measures:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            One measure per physical unit, in the product's unit. Every value
            must be greater than 0, with at most three decimals.
          items:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 999999999.999
            example: 12.5
        receivedAt:
          type: string
          format: date-time
          description: Defaults to the moment the lot is registered.
        note:
          type: string
          maxLength: 300
          nullable: true

    Customer:
      type: object
      required:
        [id, companyId, name, email, phone, address, createdAt, updatedAt]
      description: |
        A customer with contact data. `email`, `phone` and `address` are
        nullable: they are optional contact fields, and an empty value is stored
        as null. Customers soft-delete, so a deleted customer is never returned
        and has no `deletedAt` field in the contract. There is no uniqueness
        rule on the email.
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 254
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        address:
          type: string
          maxLength: 300
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 254
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        address:
          type: string
          maxLength: 300
          nullable: true

    UpdateCustomerRequest:
      type: object
      description: |
        Partial update. An absent field keeps its value; an explicit `null` or an
        empty string clears `email`, `phone` or `address`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 254
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        address:
          type: string
          maxLength: 300
          nullable: true

    MovementTrendPoint:
      type: object
      required: [date, entries, exits]
      description: |
        One UTC day of the trend. `entries` and `exits` are quantities (not
        movement counts) and are zero when there was no movement that day.
      properties:
        date:
          type: string
          format: date
          example: "2026-10-21"
        entries:
          type: integer
          minimum: 0
        exits:
          type: integer
          minimum: 0

    MovementTrendResponse:
      type: object
      required: [days, series]
      description: |
        The movement trend the dashboard draws: one point per UTC day, oldest
        first, including the days without movements.
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90
        series:
          type: array
          items:
            $ref: "#/components/schemas/MovementTrendPoint"

    MeResponse:
      type: object
      required: [id, email, fullName, createdAt, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MeMembership"

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: The role the membership will have after the change.

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: The email of the user to invite. Will be lowercased before persistence.
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: The role the user will have once they accept.

    Membership:
      type: object
      required: [id, userId, invitedEmail, companyId, role, status, invitedBy, acceptedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null until the user accepts the invitation.
        invitedEmail:
          type: string
          format: email
          description: Lowercased email of the invited user.
        companyId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        status:
          type: string
          enum: [INVITED, ACTIVE, REVOKED]
        invitedBy:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          nullable: true
          maxLength: 120
          description: |
            The new display name, or `null`/`""`/whitespace-only to clear it.
            The server trims the value before applying the 120-character cap,
            so send an already-trimmed value of at most 120 characters: this
            schema's `maxLength` measures the raw string and is deliberately
            stricter than the server. The body never carries a user id: the
            subject is always the bearer token's user.

    MediaUploadSignature:
      type: object
      required:
        [cloudName, apiKey, timestamp, signature, folder, allowedFormats, maxFileSizeBytes]
      properties:
        cloudName:
          type: string
        apiKey:
          type: string
        timestamp:
          type: integer
        signature:
          type: string
        folder:
          type: string
        allowedFormats:
          type: array
          items:
            type: string
        maxFileSizeBytes:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, issues]
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                type: string

    MalformedJsonError:
      description: |
        The JSON body could not be parsed. The body parser rejects it before it
        reaches validation, so the response carries only `message` and never
        `issues`. `additionalProperties: false` keeps this shape disjoint from
        `ValidationError`, so the `BadRequest` `oneOf` stays unambiguous.
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message:
              type: string

    CodedError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string

  responses:
    BadRequest:
      description: |
        The request body is malformed or fails validation. The response shape
        depends on which failure happened:
        - a syntactically invalid JSON body is rejected by the body parser
          before it reaches validation and is answered as `{error: {message}}`
          with no `issues`;
        - a body that parses but fails the request schema is answered as
          `{error: {message, issues}}`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/MalformedJsonError"

    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    IdentityProviderUnavailable:
      description: The identity provider could not be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: |
        An unexpected server error. The message is fixed and generic so
        internal details never leak to the client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: |
        Too many requests from this client. The global limiter applies to every
        route. `express-rate-limit` answers with a plain string, which Express
        sends as `text/html`.
      content:
        text/html:
          schema:
            type: string
            example: Too many requests, please try again later.

    RateLimitedStrict:
      description: |
        Too many requests from this client. This endpoint has a stricter
        dedicated limiter in addition to the global one. `express-rate-limit`
        answers with a plain string, which Express sends as `text/html`.
      content:
        text/html:
          schema:
            type: string
            example: Too many requests, please try again later.
