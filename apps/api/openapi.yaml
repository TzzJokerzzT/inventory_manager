openapi: 3.0.3
info:
  title: Inventory Manager API
  version: 0.1.0
  description: |
    HTTP contract between the web client and the API.

    The backend owns this document: it is the single source of truth for the
    request and response shapes and for the error codes each route can
    produce. A contract that only describes the happy path does not prevent
    the duplication it exists to prevent, so the error responses below are
    part of the contract, not decoration.

servers:
  - url: /

tags:
  - name: health
  - name: auth
  - name: companies
  - name: products
  - name: movements
  - name: customers
  - name: suppliers
  - name: lots
  - name: reports
  - name: me

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange email and password for an access token
      description: |
        On success the refresh token is set in an httpOnly cookie and only the
        access token (plus its lifetime) is returned in the body.

        Two httpOnly cookies are set, both with `path=/auth`:

        - `refresh_token` — the provider's long-lived token;
        - `session_id` — the id of the server-side session that makes the pair
          revocable and idle-limited. It is useless on its own: `POST
          /auth/refresh` requires both.

        A provider that issues no refresh token sets neither cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Invalid credentials. A wrong password and a non-existent account
            are indistinguishable on purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The credentials are correct but the email is not verified. The
            machine-readable `code` is `email_not_verified`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimitedStrict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: |
        The response is identical whether the account was created or the
        sign-up was rejected (for example a duplicate email): the API must not
        reveal which one it was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: |
            Account created, or the sign-up was rejected without revealing
            which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimitedStrict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a fresh token pair
      description: |
        The refresh token is read from the httpOnly cookie, never from the
        body, and the request requires **both** the `refresh_token` and the
        `session_id` cookies: the session is what makes the credential
        revocable and idle-limited.

        The two have to belong together. The session row stores a digest of the
        refresh token it was issued for, so pairing a stolen token with somebody
        else's live session id is rejected exactly like an expired session.

        On success the cookie is rotated when the provider issues a new
        refresh token, and the session cookie is re-set so an active session
        never loses half of the pair.

        The session gate runs before the token exchange: a session that is
        unknown, revoked or idle for longer than `SESSION_IDLE_TIMEOUT_MINUTES`
        (default five days) is rejected without spending the refresh token.
      responses:
        "200":
          description: Refresh token accepted and the session activity renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: |
            The pair is missing, the session is unknown, revoked or idle past
            its window, or the provider rejected the refresh token. The message
            is uniform so none of those causes is distinguishable, and the
            response clears both cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitedStrict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session and clear both session cookies
      description: |
        Deliberately not behind authentication: an expired access token must
        not block signing out.

        Logout revokes the server-side session (`revoked_at`), so replaying the
        same cookies against `POST /auth/refresh` answers 401 and the person
        must sign in again. No provider-side revocation is performed: revoking
        the issued refresh token needs the Auth0 Management API and is out of
        scope, so what becomes unusable is this API's only path to exchange it.

        Idempotent: no cookie, an unknown session id and an already revoked
        session all answer the same 204.
      responses:
        "204":
          description: Both session cookies are cleared; no body is returned.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies:
    post:
      tags: [companies]
      summary: Create a company
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [companies]
      summary: List the caller's companies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The companies the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user; the `code` is
            `user_not_provisioned`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/context:
    get:
      tags: [companies]
      summary: Resolve the caller's membership context in a company
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The company and the caller's role in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyContextResponse"
        "400":
          description: The company id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`). A non-existent company and a
            non-member are answered identically so company ids cannot be
            enumerated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/media/signature:
    post:
      tags: [companies]
      summary: Sign upload parameters for a direct-to-storage upload
      description: |
        The request body is ignored: every upload parameter is decided by the
        server, so the signed contract is always the server's, never the
        caller's. Uploads land in one folder per company inside the project's
        workspace folder: `inventory-manager/products/{companyId}-{company
        name}`, with the name lowercased and reduced to safe path characters.
        The company id in the URL proves the caller may ask for a signature and
        is also what names the folder.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Signed upload parameters for the storage provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadSignature"
        "400":
          description: The company id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`). A non-existent company and a
            non-member are answered identically so company ids cannot be
            enumerated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/members:
    get:
      tags: [companies]
      summary: List the company's membership roster
      description: |
        Returns the company's memberships: `ACTIVE` and `INVITED` rows. A
        `REVOKED` row is never returned -- it is not part of the roster any
        more -- and an unaccepted invitation is, with its `INVITED` status, so
        the UI can show it as pending.

        The roster is scoped to the company the caller has context for, which
        is how "only the users of your own companies" is enforced. Every role
        may list (`view_users`).
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The company's memberships.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "400":
          description: The company id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [companies]
      summary: Invite a user to the company
      description: |
        Creates an INVITED membership for the given email. The user will not
        have access to the company until they accept the invitation.

        Authorization rules (enforced by the use case):
        - MEMBER cannot invite anyone
        - ADMIN can invite MEMBER or ADMIN
        - OWNER can invite MEMBER, ADMIN, or OWNER
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`),
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`), or the caller's role cannot assign
            the target role (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The email already has an ACTIVE or INVITED membership in the
            company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/members/me:
    delete:
      tags: [companies]
      summary: Leave the company
      description: |
        Revokes the caller's own membership, which is resolved from the
        authenticated user: the request names no membership, so it can only
        ever remove the caller's own access.

        Leaving is `status = REVOKED`, never a delete: the row stays so the
        historical stock movements remain readable.

        Anyone may leave except the **last active OWNER**, because a company
        with no active OWNER is an unrecoverable state. That refusal is a 409
        (`last_active_owner`), not a 403: it is about what the company would
        become.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The caller's revoked membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: The company id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The caller's membership vanished between the context check and the
            write; the `code` is `membership_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The caller is the last active OWNER; the `code` is
            `last_active_owner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/members/{membershipId}:
    patch:
      tags: [companies]
      summary: Change a membership's role
      description: |
        Authorization, per `docs/stack.md` §5.8:
        - removing the old role and assigning the new one each need the
          matching row: `assign_member` (ADMIN/OWNER), `assign_admin` (OWNER),
          `assign_owner` (OWNER). So an ADMIN can promote a MEMBER but cannot
          demote another ADMIN, because removing ADMIN is an OWNER action.
        - nobody changes their own role (`change_own_role`), which is what
          kills self-escalation.
        - the company must keep at least one active OWNER; otherwise the answer
          is 409 `last_active_owner`.

        Setting the role the membership already has is a no-op that answers
        200 with the membership unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: |
            The company id or membership id is not a UUID, or the role is not
            one of OWNER, ADMIN, MEMBER.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user (`user_not_provisioned`), the caller
            has no ACTIVE membership (`company_access_forbidden`), the caller
            cannot assign or remove that role, or the target is the caller's
            own membership (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The membership does not belong to this company, or is REVOKED or
            gone; the `code` is `membership_not_found`. A membership of another
            company and a nonexistent one are answered identically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The change would leave the company without an active OWNER; the
            `code` is `last_active_owner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [companies]
      summary: Revoke a membership
      description: |
        Revoking is `status = REVOKED`, never a delete (§5.8), so the
        historical movements stay readable.

        Removing someone else's role needs the same permission as assigning it:
        an ADMIN can revoke a MEMBER but not another ADMIN. Revoking the
        caller's own membership is treated as leaving and follows the `leave`
        row instead; `/members/me` is the explicit route for that.

        The company must keep at least one active OWNER: revoking the last one
        is 409 `last_active_owner`.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The revoked membership, with `status: REVOKED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: The company id or membership id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The token resolves to no user (`user_not_provisioned`), the caller
            has no ACTIVE membership (`company_access_forbidden`), or the
            caller cannot remove that role (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The membership does not belong to this company, or is already
            REVOKED; the `code` is `membership_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The revocation would leave the company without an active OWNER; the
            `code` is `last_active_owner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/products:
    get:
      tags: [products]
      summary: List the company's products
      description: |
        Lists the products of the company the caller has context for. By
        default the soft-deleted products are never returned: a product with
        `deletedAt` set is not part of the catalogue any more. With
        `deleted=true` the same read returns **exactly** those products (the
        trash), with the same search and ordering.

        The list is always scoped to the company, and the `companyId` goes into
        the query rather than into a post-filter. The order is deterministic
        (name, then id) so two reads of the same state answer the same array.

        `search` matches the name or the SKU, case-insensitively, as a
        substring. Filtering by category is not part of the contract yet: the
        categories have no feature of their own; see `docs/Project.md` PROD-04
        and the decision logged in `odd/tasks/products.md`.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: Free text matched against the product name or its SKU.
          schema:
            type: string
            maxLength: 100
        - name: deleted
          in: query
          required: false
          description: |
            When true, lists **only** the soft-deleted products (the trash)
            instead of the active catalogue. The default lists active products
            only, so existing clients keep their behaviour.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            The company's products, ordered by name and then id, each with the
            costs derived from its available units (L12).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductListItem"
        "400":
          description: The company id is not a UUID, or `search` is too long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [products]
      summary: Create a product
      description: |
        Requires `manage_products`: an ADMIN or an OWNER of the company. A
        MEMBER reads the catalogue but never writes it.

        The SKU is normalized to uppercase (trimmed first) and must be unique
        within the company. Uniqueness is checked against every row, including
        the soft-deleted ones, because the database's unique index covers
        them: deleting a product reserves its SKU.

        `stockQuantity` is server-owned and is not accepted here: only stock
        movements change it. `lowStockThreshold` keeps the database default
        until the low-stock feature lands.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`), the
            caller has no ACTIVE membership in the company
            (`company_access_forbidden`), or their role cannot write products
            (`insufficient_role`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            The company already has a product (deleted or not) with that SKU;
            the `code` is `sku_already_exists`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/products/{productId}:
    get:
      tags: [products]
      summary: Read one product
      description: |
        Reads a product of the company the caller has context for. A product id
        from another company and a nonexistent one answer the same 404, so the
        endpoint cannot be used to probe other companies' product ids.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
          schema:
            type: string
