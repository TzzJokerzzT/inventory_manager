  /companies/{companyId}/products/{productId}/units:
    get:
      tags: [products]
      summary: List the units of a product
      description: |
        Lists the physical units of one product of the company the caller has
        context for, so a sale can offer **which** units leave instead of only how
        many are left (L23). Each unit carries its own `measure` and `cost`,
        because two units of the same lot do not weigh the same and therefore do
        not cost the same (S3).

        The order is the read's rule, not a client preference: the **oldest lot
        first** (`receivedAt`, then `createdAt`, then the lot id) and, inside a
        lot, by `code`. A sale offers the oldest stock first. The same product
        bought twice therefore answers its earlier purchase first.

        `status` filters the units: `AVAILABLE` (the default) is what a sale can
        still take, `SOLD` is the history of what left, and `ALL` is both. An
        unknown value answers `400` with the issue list.

        A product that never came in a lot answers `200 []`. A product of another
        company, a nonexistent one and a soft-deleted one all answer the same
        `404 product_not_found`, so the endpoint cannot be used to probe other
        companies' product ids. Any ACTIVE membership reads it, like the rest of
        the catalogue.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: |
            Which units to answer: `AVAILABLE` for the stock a sale can take
            (default), `SOLD` for the units that already left, or `ALL` for the
            whole history of the product's units.
          schema:
            type: string
            enum: [AVAILABLE, SOLD, ALL]
            default: AVAILABLE
      responses:
        "200":
          description: |
            The units of the product, oldest lot first and then by code. Empty
            when the product never came in a lot or when no unit matches the
            requested status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductUnit"
        "400":
          description: |
            The company id or the product id is not a UUID, or `status` is not
            one of `AVAILABLE`, `SOLD` or `ALL`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The product does not exist, belongs to another company, or was
            soft-deleted; the `code` is `product_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /companies/{companyId}/movements:
    get:
      tags: [movements]
      summary: List the company's stock movements
      description: |
        Lists the stock movements of the company the caller has context for,
        newest first. The history is the audit trail of the stock (MOV-05), so
        movements are immutable: there is no update or delete operation.

        `productId` narrows the history of one product (MOV-03), `customerId`
        narrows it to the sales of one customer and `type` narrows it to
        entries or exits. The product and the actor of each
        movement are resolved server-side; `actor` is null when the user row
        cannot be resolved, which never hides the movement.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          required: false
          description: Only the movements of this product.
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          required: false
          description: |
            Only the movements associated with this customer (the sales of a
            customer, combined with `type=OUT`). It is a read filter, not a
            resource: an id that does not belong to the company simply returns
            no rows.
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          description: Only entries (`IN`) or only exits (`OUT`).
          schema:
            type: string
            enum: [IN, OUT]
        - name: limit
          in: query
          required: false
          description: Maximum number of movements, newest first.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The company's movements, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
        "400":
          description: The company id is not a UUID, or a filter is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [movements]
      summary: Register a stock movement
      description: |
        Registers an entry (`IN`) or an exit (`OUT`) and applies the resulting
        stock in the same transaction (MOV-04): an entry adds, an exit
        subtracts, and if the movement cannot be recorded the stock does not
        change.

        An exit can never take the stock below zero: the decrement is guarded by
        `stockQuantity >= quantity`, so two concurrent exits cannot both win;
        the loser answers `409 insufficient_stock` with the stock available.

        A **sale of a product that has units available** -- a product bought in
        purchase lots -- must also carry `unitPrice` (the price actually charged,
        which is the same for every roll and varies only by customer) and
        `unitIds` (the whole rolls it takes, one id per unit of `quantity`).
        Missing either, or a length that does not match `quantity`, answers
        `400 units_required`; a unit that is already sold, or that belongs to
        another product or another company, answers `409 unit_not_available`.
        A product that never came in a lot keeps the quantity-only sale: no
        price and no units are required for it.

        The units are marked `SOLD`, linked to the movement and the stock is
        decremented in that same transaction, so a rejected sale leaves no unit
        marked and no stock moved. The rules are decided against the state being
        written, never against a previous read.

        Any ACTIVE membership of the company may register movements. The
        product must be active (not soft-deleted) and belong to the company.
        `userId` and `createdAt` are server-side: the caller cannot name the
        actor or backdate a movement.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMovementRequest"
      responses:
        "201":
          description: |
            The recorded movement, the units it took (with their own cost) and
            the product's stock after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterMovementResponse"
        "400":
          description: |
            The body is invalid; or a sale-only field (`customerId`,
            `unitPrice`, `unitIds`) was sent with `type: IN`, and then the
            `code` is `customer_requires_exit`, `unit_price_requires_exit` or
            `units_require_exit`; or the product has units available and the
            sale does not name them and their price, and then the `code` is
            `units_required`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CodedError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token resolves to no user (`user_not_provisioned`) or
            the caller has no ACTIVE membership in the company
            (`company_access_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "404":
          description: |
            The product does not exist, belongs to another company, or was
            soft-deleted (`product_not_found`); or the associated customer does
            not exist, belongs to another company, or was soft-deleted
            (`customer_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "409":
          description: |
            An exit larger than the available stock (`insufficient_stock`, and
            the message states the stock available); or a sale naming a unit
            that cannot be handed over (`unit_not_available`): already sold, or
            belonging to another product or another company -- the three answer
            the same code on purpose, so a foreign unit is never confirmed.
            Nothing was recorded, no unit was marked and the stock did not
            change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

