      description: |
        Lists the active suppliers of the company the caller has context for,
        ordered by name and then id. Soft-deleted suppliers are never returned.

        Any ACTIVE member reads: the roster is context for registering a
        purchase, not a management screen.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            The company's active suppliers, each with its latest purchase lot
            (L12) or `null` when the company never bought from it.
          content:
